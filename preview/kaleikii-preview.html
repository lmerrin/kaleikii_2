<style>
/* Layout: a walk along a West Coast river track — photo-led hero, calm bone-white bands, rounded river-stone shapes. */
:root {

}
@media (prefers-color-scheme: dark) {

    --panel: #212B20; --stone1: #7FAA89; --stone2: #4A7053; --stone3: #2C4232; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171E16; --surface: #1F281E; --fg: #ECE9DF; --muted: #A8B4AD; --line: #354334;

}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); }

:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; border-radius: 4px; }
main:focus { outline: none; }

.lede { color: var(--muted); max-width: 62ch; font-size: 1.05rem; }
.note { font-size: .86rem; color: var(--muted); }
.skip { position: absolute; left: -999px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 18px; padding-block: 12px; }

.brand span, .f-brand span { font-family: var(--body); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--warm); border-bottom: 1px solid var(--warm); }
nav.links { display: flex; gap: 16px; flex-wrap: wrap; font-size: .9rem; }

.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { background: none; border: 0; padding: 6px 10px; font: 600 .74rem var(--body); color: var(--muted); cursor: pointer; letter-spacing: .05em; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 600 .8rem var(--body); color: var(--fg); cursor: pointer; }
.draftnote { background: var(--panel); text-align: center; font-size: .82rem; padding-block: 6px; padding-inline: 16px; }
@media (max-width: 1020px) {
  .menu-btn { display: block; }
  nav.links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    flex-direction: column; gap: 4px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
  nav.links.open { display: flex; }
  nav.links a { padding-block: 8px; font-size: 1rem; }
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 24px; font: 600 .95rem var(--body); text-decoration: none; cursor: pointer; border: 1.5px solid var(--accent); transition: transform .2s, background .2s; width: fit-content; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost.light { color: #F3F1E9; border-color: rgba(243,241,233,.7); }
.btn.small { padding: 8px 14px; font-size: .85rem; }
.btn:hover { transform: translateY(-1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.ok-msg { font-size: .88rem; color: var(--accent); }
.warn { font-size: .88rem; background: color-mix(in srgb, var(--warm) 13%, var(--surface)); border-left: 3px solid var(--warm); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.cert { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 2px 9px; width: fit-content; }

/* Photos and fallbacks */
.photo { display: block; width: 100%; max-width: 100%; object-fit: cover; border-radius: 22px 30px 24px 34px; aspect-ratio: 4 / 3; background: var(--panel); }
.photo.tall { aspect-ratio: 4 / 5; }
.photo.square { aspect-ratio: 1; }
.photo-fallback { display: grid; place-items: center; padding: 16%; border: 1px solid var(--line); }
.photo-fallback svg { width: 100%; height: 100%; max-height: 260px; }

/* Hero */
.hero { position: relative; min-height: 560px; display: flex; align-items: flex-end; overflow: hidden; color: #F3F1E9; }
.hero .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; border: 0; }
.hero .photo-fallback.hero-bg { background: radial-gradient(120% 90% at 75% 60%, #3E5F47 0%, #253122 60%, #1A2318 100%); padding: 0; place-items: center end; }
.hero .photo-fallback.hero-bg svg { width: min(46vw, 420px); max-height: none; height: auto; margin-right: 6vw; opacity: .95; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(23,30,22,.82) 0%, rgba(23,30,22,.45) 55%, rgba(23,30,22,.1) 100%); }
.hero-inner { position: relative; padding-block: 96px 64px; display: grid; gap: 18px; max-width: 1160px; width: 100%; }
.hero h1 { max-width: 15ch; font-size: clamp(2.4rem, 6vw, 4.6rem); color: #F3F1E9; }
.eyebrow.light { color: #E3DFCF; border-bottom: 1px solid rgba(227,223,207,.5); width: fit-content; padding-bottom: 4px; }
.hero-lede { max-width: 52ch; color: #E3DFCF; font-size: 1.05rem; }
.hero .btn.primary { background: #4A7053; border-color: #4A7053; color: #F3F1E9; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-cert { font-size: .85rem; color: #E3DFCF; }

/* Bands */
.band { padding-block: 72px; display: grid; gap: 32px; }
.band.narrow { max-width: 760px; justify-items: start; }
section.alt { background: var(--panel); }
.split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; }
.split > * { min-width: 0; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.prose { display: grid; gap: 16px; max-width: 64ch; }
.page-head { display: grid; gap: 12px; max-width: 760px; }
h2.sub { margin-top: 16px; }
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }

.journey { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.journey li { display: grid; gap: 6px; align-content: start; border-top: 1px solid var(--line); padding-top: 16px; }
.journey span { font-family: var(--display); font-size: 1.4rem; color: var(--warm); }
.journey p { color: var(--muted); font-size: .92rem; }

@media (max-width: 480px) { .journey { grid-template-columns: 1fr; } }

.origins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

.origin p { color: var(--muted); font-size: .93rem; }

/* Shop */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; }
.piece { display: grid; gap: 8px; text-decoration: none; color: var(--fg); }

.piece .p { font-weight: 600; font-variant-numeric: tabular-nums; }

.shop-card { display: grid; gap: 6px; position: relative; }
.avail { position: absolute; top: 12px; left: 12px; z-index: 1; background: var(--surface); color: var(--accent); font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.shop-card .d { font-size: .86rem; color: var(--muted); }
.back { text-decoration: none; font-size: .9rem; }
.item { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.item > * { min-width: 0; }
@media (max-width: 820px) { .item { grid-template-columns: 1fr; } }
.item-price { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.specs { margin: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }

.empty { display: grid; justify-items: center; gap: 16px; text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: 24px; }

/* Forms page */
.meanings { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }

.meaning > div { display: grid; gap: 6px; min-width: 0; }
.meaning p { color: var(--muted); font-size: .93rem; }
.meaning a { font-size: .88rem; text-decoration: none; }
.meaning .thumb { aspect-ratio: 1; border-radius: 50% 46% 52% 48%; }
.letter { aspect-ratio: 1; border-radius: 50% 46% 52% 48%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 18%; }

/* Events */
.events { display: grid; border-top: 1px solid var(--line); }
.event { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.event .when { font-family: var(--display); font-size: 1.1rem; }
.event .where { color: var(--warm); font-size: .88rem; font-weight: 600; }

.form-grid { display: grid; gap: 14px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: .88rem; font-weight: 600; }
.field input, .field textarea, .field select { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; width: 100%; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.inline { display: flex; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }

.price { font-family: var(--display); font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.price small { display: block; font-family: var(--body); font-size: .85rem; opacity: .75; margin-top: 6px; }
.lines { display: grid; gap: 6px; font-size: .88rem; }
.lines div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-bottom: 5px; }
.lines div span:first-child { opacity: .75; }
.lines div span:last-child { text-align: right; }

.how { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: .9rem; }
.amounts { display: flex; gap: 10px; flex-wrap: wrap; }
.amount { font: 600 1.05rem var(--body); padding: 12px 22px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.amount.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

/* Footer */
footer { background: var(--ink); color: var(--bone); padding-block: 56px 28px; }

.foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
.foot > * { display: grid; gap: 10px; align-content: start; min-width: 0; }
.foot nav { display: grid; gap: 6px; }
footer a { color: var(--sage); text-decoration: none; }
footer p { opacity: .85; font-size: .92rem; }
footer .cert { color: var(--sage); border-color: var(--sage); }
.f-brand { font-family: var(--display); font-size: 1.8rem; opacity: 1 !important; display: flex; gap: 8px; align-items: baseline; }
.copy { margin-top: 32px; font-size: .8rem; opacity: .65; }
@media (max-width: 760px) { .foot { grid-template-columns: 1fr; } }

.boot { padding: 80px 16px; text-align: center; color: var(--muted); }
</style>

  { key: "ngai_tahu_pounamu", label: "Ngāi Tahu certified pounamu", pct: 75, certified: true, nzOnly: true },
  { key: "premium", label: "Premium varieties (īnanga, kahurangi, etc.)", pct: 100, isFrom: true, nzOnly: true },
  { key: "whalebone", label: "Whalebone", pct: 100, isFrom: true, whalebone: true, nzOnly: true },
];

const PLAITS = [
  { key: "3", label: "3-plait", price: 0 },
  { key: "4", label: "4-plait", price: 50 },
  { key: "8", label: "8-plait and up", price: 150 },
];

const COUNTRIES = ["Aotearoa New Zealand", "Australia", "United States (incl. Hawaiʻi)", "Other country"];
const NZ = COUNTRIES[0];

const nzd = (n) => "$" + Math.round(n).toLocaleString("en-NZ") + " NZD";
const usd = (n) => "$" + Math.round(n * SETTINGS.usdRate).toLocaleString("en-US") + " USD";
// Materials that can only be delivered or collected within New Zealand
const isNzOnly = (key) => !!(MATERIALS.find((m) => m.key === key) || {}).nzOnly;

const materialLabel = (key) => (MATERIALS.find((m) => m.key === key) || {}).label || key;

// Which size group applies to the current selection
function sizeGroupFor(state) {
  if (state.category === "tiki") return "tiki";
  if (state.category !== "standard" || !state.form) return null;
  return FORMS.find((f) => f.key === state.form).group;
}

function hasPlait(state) {
  return state.category !== "sculptural" && state.form !== "earrings";
}

function timeframe(state) {
  if (state.category === "sculptural" || state.category === "other") return "Agreed case by case";
  if (state.category === "tiki") return "2–3 weeks";
  const g = sizeGroupFor(state);
  return g === "simple" || !g ? "About 1 week" : "2–3 weeks";
}

function shippingFee(state, subtotal) {
  if (!state.delivery) return null;
  if (state.delivery === "pickup") return 0;
  if (state.country !== NZ) return SETTINGS.intlShippingFee;
  return subtotal >= SETTINGS.nzFreeThreshold ? 0 : SETTINGS.nzShippingFee;
}

// Returns { quote: true } or { total, isFrom, shipping }
function estimate(state) {
  if (state.category === "other") return { quote: true };
  const group = sizeGroupFor(state);
  if (!group || !state.size) return null;
  const size = SIZE_GROUPS[group].find((s) => s.key === state.size);
  if (!size) return null;
  if (size.quoteOnly) return { quote: true };
  const mat = MATERIALS.find((m) => m.key === state.material);
  let total = size.price * (1 + (mat ? mat.pct : 0) / 100);
  const plait = hasPlait(state) ? PLAITS.find((p) => p.key === state.plait) : null;
  if (plait) total += plait.price;
  const ship = shippingFee(state, total);
  if (ship) total += ship;
  return { total, isFrom: !!size.isFrom || !!(mat && mat.isFrom), shipping: ship };
}

const EMPTY = { category: null, form: null, size: null, material: null, plait: null, country: NZ, delivery: null, address: "" };

function Commission() {
  const [s, setS] = useState(EMPTY);
  const [step, setStep] = useState(0);
  const [d, setD] = useState({ who: "", occasion: "", meaning: "", extra: "", name: "", email: "", phone: "", voucher: "", gallery: false });
  const [voucherMsg, setVoucherMsg] = useState("");
  const full = SETTINGS.openCommissions >= SETTINGS.capacity;

  const update = (patch) => setS((prev) => {
    const next = { ...prev, ...patch };
    if (next.country !== NZ && isNzOnly(next.material)) next.material = null;
    if (next.country !== NZ && next.delivery === "pickup") next.delivery = "ship";
    return next;
  });

  if (s.category === "sculptural") return <SculpturalInquiry onBack={() => { setS(EMPTY); setStep(0); }} />;

  // Steps that apply to this selection
  const steps = ["category"];
  if (s.category === "standard") steps.push("form");
  if (s.category === "standard" || s.category === "tiki") steps.push("size");
  steps.push("material");
  if (hasPlait(s)) steps.push("plait");
  steps.push("delivery", "details");
  const current = steps[Math.min(step, steps.length - 1)];

  const group = sizeGroupFor(s);
  const done = {
    category: !!s.category, form: !!s.form, size: !!s.size, material: !!s.material, plait: !!s.plait,
    delivery: !!s.delivery && (s.delivery === "pickup" || s.address.trim().length > 3), details: true,
  };
  const est = estimate(s);
  const subtotalForShip = est && !est.quote ? est.total - (est.shipping || 0) : 0;
  const ship = shippingFee(s, subtotalForShip);
  const formLabel = s.category === "tiki" ? "Hei tiki" : (FORMS.find((x) => x.key === s.form) || {}).label;
  const sizeObj = group && SIZE_GROUPS[group].find((x) => x.key === s.size);

  const setDf = (k) => (e) => setD({ ...d, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });

  const summary = [
    "Kaleikiʻi commission request",
    "Category: " + (CATEGORIES.find((c) => c.key === s.category) || {}).label,
    formLabel ? "Form: " + formLabel : null,
    sizeObj ? "Size: " + sizeObj.key + " · " + sizeObj.label : null,
    s.material ? "Material: " + materialLabel(s.material) : null,
    hasPlait(s) && s.plait ? "Plait: " + PLAITS.find((p) => p.key === s.plait).label : null,
    "Delivery: " + (s.delivery === "pickup" ? "Pickup in Auckland" : "Ship to " + s.country) + (s.address ? " · " + s.address : ""),
    "Estimate: " + (!est ? "—" : est.quote ? "Quote on request" : (est.isFrom ? "from " : "") + nzd(est.total)),
    "For: " + d.who, "Occasion: " + d.occasion, "Meaning: " + d.meaning, d.extra ? "Anything else: " + d.extra : null,
    "Name: " + d.name, "Email: " + d.email, d.phone ? "Phone: " + d.phone : null,
    d.voucher ? "Gift voucher: " + d.voucher : null, "Gallery photos OK: " + (d.gallery ? "yes" : "no"),
  ].filter(Boolean).join("\n");

  const titles = { category: "Choose a category", form: "Choose a form", size: "Choose a size", material: "Choose a material",
    plait: "Choose a necklace plait", delivery: "Delivery", details: "Who it's for & your details" };

  return (
    <div className="com-grid">
      <div className="com-main">
        {full && <div className="warn">The bench is full right now (10 open commissions). Join the waitlist on Instagram and you'll hear when a spot opens.</div>}
        <p className="step-count">Step {steps.indexOf(current) + 1} of {steps.length}</p>
        <h3 className="step-title">{titles[current]}</h3>

        {current === "category" && (
          <div className="choices">
            {CATEGORIES.map((c) => <Choice key={c.key} name="cat" value={c.key} current={s.category} title={c.label} sub={c.sub}
              onPick={(v) => update({ category: v, form: v === "tiki" ? "hei_tiki" : null, size: null })} />)}
          </div>
        )}
        {current === "form" && (
          <div className="choices cols">
            {FORMS.map((x) => <Choice key={x.key} name="form" value={x.key} current={s.form} title={x.label}
              onPick={(v) => update({ form: v, size: null, plait: v === "earrings" ? null : s.plait })} />)}
          </div>
        )}
        {current === "size" && group && (
          <div className="choices">
            {SIZE_GROUPS[group].map((z) => <Choice key={z.key} name="size" value={z.key} current={s.size} title={z.key + " · " + z.label}
              aside={z.quoteOnly ? "Quote on request" : (z.isFrom ? "from " : "") + nzd(z.price)} onPick={(v) => update({ size: v })} />)}
          </div>
        )}
        {current === "material" && (
          <>
            <Field id="cm-country" label="Delivering to">
              <select id="cm-country" value={s.country} onChange={(e) => update({ country: e.target.value })}>
                {COUNTRIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            {s.country !== NZ && <p className="warn">NZ pounamu and whalebone stay in Aotearoa and are only available to New Zealand buyers. Overseas pieces are carved in nephrite jade from Canada, Wyoming or Guatemala.</p>}
            <div className="choices">
              {MATERIALS.map((m) => <Choice key={m.key} name="mat" value={m.key} current={s.material} title={m.label}
                badge={m.certified ? "Ngāi Tahu certified" : null}
                sub={m.nzOnly ? (s.country === NZ ? "Aotearoa New Zealand only" : "Available to New Zealand buyers only") : null}
                disabled={m.nzOnly && s.country !== NZ}
                aside={(m.isFrom ? "from " : "") + "+" + m.pct + "%"} onPick={(v) => update({ material: v })} />)}
            </div>
          </>
        )}
        {current === "plait" && (
          <div className="choices">
            {PLAITS.map((p) => <Choice key={p.key} name="plait" value={p.key} current={s.plait} title={p.label}
              aside={p.price ? "+" + nzd(p.price) : "Included"} onPick={(v) => update({ plait: v })} />)}
          </div>
        )}
        {current === "delivery" && (
          <>
            <Field id="cm-country2" label="Delivery country">
              <select id="cm-country2" value={s.country} onChange={(e) => update({ country: e.target.value })}>
                {COUNTRIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <div className="choices">
              {s.country === NZ ? (
                <>
                  <Choice name="del" value="ship" current={s.delivery} title="Tracked shipping within NZ" aside={"Free over $" + SETTINGS.nzFreeThreshold + ", otherwise $" + SETTINGS.nzShippingFee} onPick={(v) => update({ delivery: v })} />
                  <Choice name="del" value="pickup" current={s.delivery} title="Pickup in Auckland" sub="CBD or North Shore, arranged by message" aside="Free" onPick={(v) => update({ delivery: v })} />
                </>
              ) : (
                <Choice name="del" value="ship" current={s.delivery} title="International shipping" sub="Tracked and insured" aside={"$" + SETTINGS.intlShippingFee + " NZD"} onPick={(v) => update({ delivery: v })} />
              )}
            </div>
            {s.delivery !== "pickup" && (
              <Field id="cm-addr" label="Delivery address">
                <textarea id="cm-addr" value={s.address} onChange={(e) => update({ address: e.target.value })} />
              </Field>
            )}
            {s.delivery && <p className="note">Shipping: {ship === 0 ? "Free" : ship != null ? nzd(ship) : "—"}</p>}
          </>
        )}
        {current === "details" && (
          <div className="form-grid">
            <div className="two">
              <Field id="cd-who" label="Who is it for?"><input id="cd-who" value={d.who} onChange={setDf("who")} /></Field>
              <Field id="cd-occ" label="The occasion"><input id="cd-occ" value={d.occasion} onChange={setDf("occasion")} /></Field>
            </div>
            <Field id="cd-mean" label="The meaning it should carry"><textarea id="cd-mean" value={d.meaning} onChange={setDf("meaning")} /></Field>
            <Field id="cd-extra" label="Anything else (optional)"><textarea id="cd-extra" value={d.extra} onChange={setDf("extra")} /></Field>
            <Field id="cd-img" label="Inspiration images (optional)"><input id="cd-img" type="file" accept="image/*" multiple /></Field>
            <div className="two">
              <Field id="cd-name" label="Full name"><input id="cd-name" value={d.name} onChange={setDf("name")} autoComplete="name" /></Field>
              <Field id="cd-email" label="Email"><input id="cd-email" type="email" value={d.email} onChange={setDf("email")} autoComplete="email" /></Field>
            </div>
            <div className="two">
              <Field id="cd-phone" label="Phone (optional)"><input id="cd-phone" value={d.phone} onChange={setDf("phone")} autoComplete="tel" /></Field>
              <Field id="cd-voucher" label="Gift voucher code (optional)">
                <div className="inline">
                  <input id="cd-voucher" value={d.voucher} onChange={setDf("voucher")} placeholder="KK-XXXX-XXXX" />
                  <button type="button" className="btn ghost small" onClick={() => setVoucherMsg(/^KK-[A-Z0-9]{4}-[A-Z0-9]{4}$/i.test(d.voucher.trim())
                    ? "Code noted. It comes off your payments once your request is approved."
                    : "Check the code. It looks like KK-XXXX-XXXX.")}>Apply</button>
                </div>
              </Field>
            </div>
            {voucherMsg && <p className="note" role="status">{voucherMsg}</p>}
            <label className="check" htmlFor="cd-gallery"><input id="cd-gallery" type="checkbox" checked={d.gallery} onChange={setDf("gallery")} /> I'm happy for photos of my finished piece to be shared in the Kaleikiʻi gallery (no names or personal details).</label>
            <ConsentNote />
          </div>
        )}

        <div className="nav-btns">
          {step > 0 && <button type="button" className="btn ghost" onClick={() => setStep(steps.indexOf(current) - 1)}>Back</button>}
          {current !== "details"
            ? <button type="button" className="btn primary" disabled={!done[current]} onClick={() => setStep(steps.indexOf(current) + 1)}>Continue</button>
            : <SendPanel summary={summary} label="Send my request" />}
        </div>
      </div>

      <aside className="summary" aria-live="polite">
        <p className="eyebrow">Your estimate</p>
        <div className="price">
          {!est ? "—" : est.quote ? "Quote on request" : <>{est.isFrom ? "From " : "Estimated "}{nzd(est.total)}<small>≈ {usd(est.total)} · deposit {nzd(est.total * SETTINGS.depositPct / 100)}</small></>}
        </div>
        <p className="note">Timeframe: {timeframe(s)}</p>
        <div className="lines">
          <div><span>Category</span><span>{(CATEGORIES.find((c) => c.key === s.category) || {}).label || "—"}</span></div>
          <div><span>Form</span><span>{formLabel || "—"}</span></div>
          <div><span>Size</span><span>{sizeObj ? sizeObj.key + " · " + sizeObj.label : "—"}</span></div>
          <div><span>Material</span><span>{s.material ? materialLabel(s.material) : "—"}</span></div>
          {hasPlait(s) && <div><span>Plait</span><span>{s.plait ? PLAITS.find((p) => p.key === s.plait).label : "—"}</span></div>}
          <div><span>Shipping</span><span>{ship === 0 ? "Free" : ship != null ? nzd(ship) : "—"}</span></div>
        </div>
        <p className="note">Final price is confirmed when your request is approved. 50% non-refundable deposit on approval; the balance is paid once you've seen photos of the finished piece.</p>
      </aside>
    </div>
  );
}

function GiftPage() {
  const [amount, setAmount] = useState(200);
  const [g, setG] = useState({ fromName: "", fromEmail: "", toName: "", toEmail: "", message: "", copy: true, terms: false });
  const [msg, setMsg] = useState("");
  const set = (k) => (e) => setG({ ...g, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const valid = amount >= SETTINGS.voucherMin && g.terms;
  const buy = () => {
    const text = ["Kaleikiʻi gift voucher", "Amount: " + nzd(amount), "From: " + g.fromName + " (" + g.fromEmail + ")",
      "To: " + g.toName + " (" + g.toEmail + ")", "Message: " + g.message, "Email me a copy: " + (g.copy ? "yes" : "no")].join("\n");
    copyText(text).then(() => setMsg("Your voucher details are copied. Send them to @kaleikii to complete payment."));
  };
  return (
    <section className="wrap band">
      <PageHead eyebrow="Gift a commission" title="A taonga for someone far away"
        lede="Send whānau and friends anywhere in the world a gift voucher towards a hand-carved commission. They choose the form, the stone and the story." />
      <div className="com-grid">
        <div className="com-main form-grid">
          <p className="eyebrow">Choose an amount</p>
          <div className="amounts">
            {SETTINGS.voucherAmounts.map((a) => (
              <button key={a} type="button" className={"amount" + (amount === a ? " on" : "")} aria-pressed={amount === a} onClick={() => setAmount(a)}>${a}</button>
            ))}
          </div>
          <Field2 id="gv-amt" label={"Or another amount (minimum $" + SETTINGS.voucherMin + " NZD)"}>
            <input id="gv-amt" type="number" min={SETTINGS.voucherMin} value={amount} onChange={(e) => setAmount(Number(e.target.value) || 0)} />
          </Field2>
          <p className="eyebrow">From you</p>
          <div className="two">
            <Field2 id="gv-fn" label="Your name"><input id="gv-fn" value={g.fromName} onChange={set("fromName")} /></Field2>
            <Field2 id="gv-fe" label="Your email"><input id="gv-fe" type="email" value={g.fromEmail} onChange={set("fromEmail")} /></Field2>
          </div>
          <p className="eyebrow">To</p>
          <div className="two">
            <Field2 id="gv-tn" label="Their name"><input id="gv-tn" value={g.toName} onChange={set("toName")} /></Field2>
            <Field2 id="gv-te" label="Their email"><input id="gv-te" type="email" value={g.toEmail} onChange={set("toEmail")} /></Field2>
          </div>
          <Field2 id="gv-msg" label="Personal message (optional)"><textarea id="gv-msg" value={g.message} onChange={set("message")} /></Field2>
          <label className="check" htmlFor="gv-copy"><input id="gv-copy" type="checkbox" checked={g.copy} onChange={set("copy")} /> Email me a copy of the voucher</label>
          <label className="check" htmlFor="gv-terms"><input id="gv-terms" type="checkbox" checked={g.terms} onChange={set("terms")} /> I understand gift vouchers are non-refundable, valid for two years, and redeemable against custom commissions.</label>
          <button type="button" className="btn primary" disabled={!valid} onClick={buy}>Buy voucher · {nzd(amount)}</button>
          {amount < SETTINGS.voucherMin && <p className="warn">The minimum voucher is ${SETTINGS.voucherMin} NZD.</p>}
          {msg && <p className="ok-msg" role="status">{msg}</p>}
        </div>
        <aside className="summary voucher">
          <p className="f-brand">Kaleikiʻi</p>
          <p className="eyebrow">Gift a commission</p>
          <div className="price">{nzd(amount)}<small>≈ {usd(amount)}</small></div>
          <p className="eyebrow">How it works</p>
          <ol className="how">
            <li>You pay securely and we email the voucher, with your message, straight to them.</li>
            <li>They enter the code on the last step of the commission form.</li>
            <li>Its value comes off their payments until it's used up — valid for two years.</li>
          </ol>
        </aside>
      </div>
    </section>
  );
}

      <a className="btn primary" href="#commission">Start a commission</a>
    </section>
  );
}

function EventsPage() {
  return (
    <section className="wrap band">
      <PageHead eyebrow="Fairs & markets" title="Upcoming events" lede="Meet the carver, see the stone in person and talk through a commission." />
      <div className="events">
        {EVENTS.map((e) => (
          <div className="event" key={e.title}>
            <span className="when">{e.date}</span>
            <div><h3>{e.title}</h3><span className="where">{e.place}</span><p>{e.note}</p></div>
          </div>
        ))}
      </div>
    </section>
  );
}

function FaqPage() {
  return (
    <section className="wrap band">
      <PageHead eyebrow="Good to know" title="FAQ & Terms" />
      <div className="faq">
        {FAQ.map(([q, a], i) => <details key={q} open={i === 0}><summary>{q}</summary><p>{a}</p></details>)}
      </div>
      <h2 className="sub">Terms</h2>
      <ol className="terms">{TERMS.map((x) => <li key={x}>{x}</li>)}</ol>
    </section>
  );
}

function ContactPage() {
  const [c, setC] = useState({ name: "", email: "", subject: "", message: "" });
  const [msg, setMsg] = useState("");
  const set = (k) => (e) => setC({ ...c, [k]: e.target.value });
  const send = () => copyText("From: " + c.name + " (" + c.email + ")\nSubject: " + c.subject + "\n\n" + c.message)
    .then(() => setMsg("Your message is copied. Paste it into the Instagram message that opens."));
  return (
    <section className="wrap band">
      <PageHead eyebrow="Kōrero mai" title="Contact" lede="Questions about a piece, a commission or an event? Send a message and you'll hear back personally." />
      <div className="split">
        <div className="form-grid">
          <div className="two">
            <Field2 id="ct-name" label="Full name"><input id="ct-name" value={c.name} onChange={set("name")} autoComplete="name" /></Field2>
            <Field2 id="ct-email" label="Email"><input id="ct-email" type="email" value={c.email} onChange={set("email")} autoComplete="email" /></Field2>
          </div>
          <Field2 id="ct-subj" label="Subject"><input id="ct-subj" value={c.subject} onChange={set("subject")} /></Field2>
          <Field2 id="ct-msg" label="Message"><textarea id="ct-msg" value={c.message} onChange={set("message")} /></Field2>
          <a className="btn primary" href={SETTINGS.instagramUrl} target="_blank" rel="noopener" onClick={send}>Send message</a>
          {msg && <p className="ok-msg" role="status">{msg}</p>}
        </div>
        <div className="prose contact-side">
          <h3>Tāmaki Makaurau · Auckland</h3>
          <p>Free pickup or handover in Auckland CBD or the North Shore, arranged by message once ready.</p>
          <p>Instagram: <a href={SETTINGS.instagramUrl} target="_blank" rel="noopener">@kaleikii</a></p>
        </div>
      </div>
    </section>
  );
}

// ---- src/App.jsx ----





const NAV = [
  ["commission", "navCommission"], ["shop", "navShop"], ["gallery", "navGallery"], ["gift", "navGift"],
  ["forms", "navForms"], ["about", "navAbout"], ["events", "navEvents"], ["faq", "navFaq"], ["contact", "navContact"],
];

function readHash() {
  const h = (window.location.hash || "").replace(/^#/, "");
  return h || "home";
}
function readLang() {
  try {
    const v = localStorage.getItem("kk-lang");
    if (v === "en" || v === "mi" || v === "haw") return v;
  } catch (e) { /* storage unavailable */ }
  return "en";
}

function App() {
  const [route, setRoute] = useState(readHash);
  const [lang, setLang] = useState(readLang);
  const [menu, setMenu] = useState(false);
  const t = (k) => I18N[lang][k] || I18N.en[k] || k;

  useEffect(() => {
    const on = () => { setRoute(readHash()); setMenu(false); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  useEffect(() => {
    document.documentElement.lang = lang;
    try { localStorage.setItem("kk-lang", lang); } catch (e) { /* ignore */ }
  }, [lang]);

  let page;
  if (route.startsWith("item-")) page = <ShopItemPage id={route.slice(5)} />;
  else page = {
    commission: <CommissionPage />, shop: <ShopPage />, gallery: <GalleryPage />, gift: <GiftPage />,
    forms: <FormsPage />, about: <AboutPage />, events: <EventsPage />, faq: <FaqPage />, contact: <ContactPage />,
  }[route] || <HomePage t={t} />;

  const active = route.startsWith("item-") ? "shop" : route;

  return (
    <>
      <Gradients />
      <a className="skip" href="#main-content" onClick={(e) => { e.preventDefault(); document.getElementById("main-content").focus(); }}>Skip to content</a>
      <header className="top">
        <div className="wrap bar">
          <a className="brand" href="#home">Kaleikiʻi <span>Carver</span></a>
          <nav className={"links" + (menu ? " open" : "")} aria-label="Main">
            {NAV.map(([r, k]) => <a key={r} href={"#" + r} aria-current={active === r ? "page" : undefined}>{t(k)}</a>)}
          </nav>
          <div className="lang" role="group" aria-label="Language">
            {["en", "mi", "haw"].map((l) => (
              <button key={l} type="button" aria-pressed={lang === l} onClick={() => setLang(l)}>{l.toUpperCase()}</button>
            ))}
          </div>
          <button type="button" className="menu-btn" aria-expanded={menu} onClick={() => setMenu(!menu)}>{menu ? "Close" : "Menu"}</button>
        </div>
        {lang !== "en" && <div className="draftnote">Draft translation of menus and headings, still to be checked by a fluent speaker.</div>}
      </header>

      <main id="main-content" tabIndex={-1}>{page}</main>

      <footer>
        <div className="wrap foot">
          <div>
            <p className="f-brand">Kaleikiʻi <span>Carver</span></p>
            <p>Hand-carved pounamu, jade and bone taonga from Tāmaki Makaurau, Auckland. Shipping worldwide; whalebone within Aotearoa only.</p>
            <p className="cert">Certified carver</p>
          </div>
          <nav aria-label="Footer">{NAV.map(([r, k]) => <a key={r} href={"#" + r}>{t(k)}</a>)}</nav>
          <div>
            <p><a href={SETTINGS.instagramUrl} target="_blank" rel="noopener">@kaleikii</a></p>
            <p>Tāmaki Makaurau · Auckland, Aotearoa</p>
          </div>
        </div>
        <div className="wrap copy">© 2026 Kaleikiʻi. Ngā mihi · Mahalo nui.</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</html>
